name: Build Spawner Protect

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spawnerprotect-26.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: spawnerprotect-jar
          path: spawnerprotect-26.2/build/libs/spawnerprotect-*.jar
